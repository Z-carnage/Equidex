<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#141417">
<title>EQUIDEX</title>
<script>/* dark unless Light was chosen; applied before first paint */try{document.documentElement.setAttribute('data-theme', JSON.parse(localStorage.getItem('eqxm.theme')||'"dark"')==='light'?'light':'dark');}catch(e){document.documentElement.setAttribute('data-theme','dark');}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  /* EQUIDEX mobile — a phone-first app on the same serve.py API and the same colour tokens as the desktop
     terminal. Layout rules that keep data inside the screen: every row is a grid of minmax(0,1fr) + auto,
     text truncates with an ellipsis, numbers never wrap, nothing has a fixed width wider than its cell. */
  :root{
    color-scheme:dark;
    --page:#000000; --surface:#141417; --raised:#1f1f24; --hover:#2a2a30;
    --border:#2c2c34; --border-strong:#40414b;
    --muted:#949bad; --text2:#c4c8d4; --text:#f3f4f8;
    --accent:#46a9f2; --accent-weak:rgba(70,169,242,.16); --accent-ink:#08111f;
    --gain:#2fd483; --gain-weak:rgba(47,212,131,.16);
    --loss:#ff5c6a; --loss-weak:rgba(255,92,106,.16);
    --flag:#e0a83e; --flag-weak:rgba(224,168,62,.15);
    --font:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --bar:56px; --tabs:60px; --r:14px; --pad:16px;

    --font-scale:1; --dense-scale:1;
    --caption:calc(.6875rem * var(--text-scale)); --small:calc(.75rem * var(--text-scale));
    --small-plus:calc(.8125rem * var(--text-scale)); --body:calc(.875rem * var(--text-scale));
    --body-plus:calc(.9375rem * var(--text-scale)); --title-size:calc(1.125rem * var(--text-scale));
    --headline:calc(1.5rem * var(--text-scale)); --input-size:calc(1rem * var(--text-scale));
    --text-scale:var(--font-scale);
    --top:max(env(safe-area-inset-top,0px),var(--native-top,0px));
    --bottom:max(env(safe-area-inset-bottom,0px),var(--native-bottom,0px));
    --left:max(env(safe-area-inset-left,0px),var(--native-left,0px));
    --right:max(env(safe-area-inset-right,0px),var(--native-right,0px));

  }
  /* dark is the app's identity and the default; light only when chosen in More → Appearance */
  :root[data-theme="light"]{
    color-scheme:light;
    --page:#eceef1; --surface:#f4f5f8; --raised:#eaebef; --hover:#e0e2e8; --border:#d7dae1; --border-strong:#c3c6ce;
    --muted:#5a5a5f; --text2:#3a3a3e; --text:#101012;
    --accent:#2f6fd6; --accent-weak:rgba(47,111,214,.10); --accent-ink:#ffffff;
    --gain:#0f8a5a; --gain-weak:rgba(15,138,90,.12); --loss:#c53540; --loss-weak:rgba(197,53,64,.10);
    --flag:#b3771a; --flag-weak:rgba(179,119,26,.13);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  [hidden]{display:none !important;}
  html,body{height:100%;}
  body{background:var(--page);color:var(--text);font-family:var(--font);font-size:var(--body-plus);line-height:1.4;
    font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none;
    -webkit-text-size-adjust:100%;user-select:none;}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
  input{font:inherit;color:inherit;}
  .num{font-variant-numeric:tabular-nums;white-space:nowrap;}
  .up{color:var(--gain);} .down{color:var(--loss);} .flat{color:var(--muted);}
  /* a price that just changed: brief tint, 0.6 s, off under reduced motion */
  .fu{animation:fu .6s ease-out;} .fd{animation:fd .6s ease-out;}
  @keyframes fu{0%{background:var(--gain-weak);box-shadow:0 0 0 4px var(--gain-weak);}100%{background:transparent;box-shadow:0 0 0 4px transparent;}}
  @keyframes fd{0%{background:var(--loss-weak);box-shadow:0 0 0 4px var(--loss-weak);}100%{background:transparent;box-shadow:0 0 0 4px transparent;}}
  .p,.v,.px{border-radius:6px;}
  @media (prefers-reduced-motion: reduce){.fu,.fd{animation:none;}}

  /* ---------- app frame ---------- */
  #app{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto;background:var(--page);}
  #app > *{flex:none;min-width:0;}
  #app > #screens{flex:1 1 0;}
  #bar{height:calc(var(--bar) + var(--top));padding:var(--top) 6px 0;display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:4px;background:var(--surface);border-bottom:1px solid var(--border);}
  #lead{display:flex;align-items:center;justify-self:start;}
  #title{font-size:var(--input-size);font-weight:700;letter-spacing:.22em;padding-left:.22em;white-space:nowrap;text-align:center;}
  .ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--text2);flex:none;}
  .ib:active{background:var(--hover);}
  .ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  .ib.on{color:var(--flag);} .ib.on svg{fill:currentColor;}
  #actions{display:flex;align-items:center;justify-self:end;min-width:0;}
  #modeBtn{height:32px;padding:0 12px;margin-right:4px;border-radius:99px;border:1px solid var(--border-strong);background:var(--raised);font-size:var(--small);font-weight:700;letter-spacing:.04em;color:var(--text2);}
  #banner{display:none;background:var(--flag-weak);color:var(--flag);font-size:var(--small-plus);font-weight:500;padding:7px var(--pad);text-align:center;border-bottom:1px solid var(--border);}
  #banner.show{display:block;}
  #screens{position:relative;min-height:0;overflow:hidden;}
  .screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding:12px var(--pad) 24px;display:none;}
  .screen,.dw-body,.tw{scrollbar-width:none;-ms-overflow-style:none;scroll-behavior:smooth;}
  .screen::-webkit-scrollbar,.dw-body::-webkit-scrollbar,.tw::-webkit-scrollbar{display:none;width:0;height:0;}
  @media (prefers-reduced-motion:reduce){.screen,.dw-body,.tw{scroll-behavior:auto;}}
  .screen.active{display:block;animation:in .16s ease-out;}
  @keyframes in{from{opacity:.4;transform:translateY(6px);}to{opacity:1;transform:none;}}
  #tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:var(--surface);border-top:1px solid var(--border);padding-bottom:var(--bottom);}
  #tabs.hide{display:none;}
  #tabs button{height:var(--tabs);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:var(--caption);font-weight:600;min-width:0;}
  #tabs svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
  #tabs button .pill{width:56px;height:30px;border-radius:99px;display:grid;place-items:center;transition:background .15s;}
  #tabs button.on{color:var(--text);} #tabs button.on .pill{background:var(--accent-weak);color:var(--accent);}

  /* ---------- building blocks ---------- */
  .h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:22px 0 10px;}
  .screen > .h:first-child{margin-top:4px;}
  .h h2{font-size:var(--small-plus);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap;}
  .h .link{display:inline-flex;align-items:center;gap:2px;height:32px;padding:0 4px 0 10px;margin:-6px -4px -6px 0;border-radius:99px;font-size:var(--small-plus);font-weight:600;color:var(--accent);white-space:nowrap;}
  .h .link:active{background:var(--accent-weak);}
  .h .link svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
  .h .meta{font-size:var(--small);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;}
  .inst-filters{margin-bottom:10px;}
  .inst-filters summary{padding:10px 12px;font-size:var(--small-plus);font-weight:600;cursor:pointer;}
  .inst-filter-body{padding:0 12px 12px;}
  .inst-filter-body label{font-size:var(--small);color:var(--muted);min-width:0;}
  .inst-filter-body .in{height:36px;margin-top:4px;padding:0 8px;font-size:var(--input-size);}
  .inst-filter-body .btn{height:36px;font-size:var(--small-plus);padding:0 12px;}
  .mover-controls{display:flex;align-items:stretch;gap:3px;}
  .mover-controls .seg{flex:1;min-width:0;gap:1px;padding:2px;}
  .mover-controls .seg button{height:34px;font-size:var(--small);padding:0 5px;}
  .mover-controls #mkSeg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));flex:3;}
  .mover-controls #mkCap{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));flex:6;gap:1px;padding:2px;}
  .mover-controls .seg button{min-width:0;padding:0 1px;white-space:normal;overflow:visible;overflow-wrap:anywhere;line-height:1.2;}
  @media(max-width:420px){.mover-controls .seg button{height:44px;font-size:var(--caption);}}
  .chip{display:inline-flex;align-items:center;gap:3px;height:24px;padding:0 9px;border-radius:99px;font-size:var(--small-plus);font-weight:700;white-space:nowrap;}
  .chip.up{background:var(--gain-weak);} .chip.down{background:var(--loss-weak);} .chip.flat{background:var(--raised);}
  .chip.status{height:22px;font-size:var(--caption);font-weight:600;}
  .chip.open{background:var(--gain-weak);color:var(--gain);} .chip.closed{background:var(--flag-weak);color:var(--flag);}
  .chip.ext{background:var(--accent-weak);color:var(--accent);} .chip.stale{background:var(--loss-weak);color:var(--loss);}
  .seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px;padding:3px;background:var(--raised);border-radius:12px;}
  .seg button{height:36px;border-radius:9px;font-size:var(--small-plus);font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.35);}
  /* list rows: name block flexes and truncates, the numbers keep their natural width */
  .row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;min-height:64px;padding:10px 14px;border-bottom:1px solid var(--border);text-align:left;width:100%;}
  .row:last-child{border-bottom:0;} .row:active{background:var(--hover);}
  .row .l{min-width:0;} .row .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px;}
  .row .s{font-size:var(--body-plus);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .row .n{font-size:var(--small-plus);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}
  .row .p{font-size:var(--body-plus);font-weight:600;white-space:nowrap;}
  .row .tag{font-size:var(--caption);font-weight:700;letter-spacing:.04em;color:var(--muted);border:1px solid var(--border-strong);border-radius:5px;padding:1px 5px;margin-left:6px;vertical-align:1px;}
  .row.edit{grid-template-columns:auto minmax(0,1fr) auto;}
  #s-watch .row.edit{touch-action:none;cursor:grab;position:relative;}
  #s-watch .row.dragging{z-index:2;background:var(--surface);border-radius:12px;outline:1px solid var(--accent);outline-offset:-1px;box-shadow:0 8px 20px rgba(0,0,0,.25);cursor:grabbing;}
  #s-watch .card{position:relative;}
  #s-watch .row.edit{grid-template-columns:auto minmax(0,1fr);}
  .rm{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--loss);background:var(--loss-weak);font-size:var(--title-size);font-weight:700;line-height:1;}
  .empty{padding:36px 20px;text-align:center;color:var(--muted);font-size:var(--body);}
  .empty b{display:block;color:var(--text);font-size:var(--input-size);margin-bottom:6px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 20px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:var(--body);margin-top:14px;}
  .btn.ghost{background:var(--raised);color:var(--text);border:1px solid var(--border-strong);}
  /* skeleton */
  .sk{display:block;border-radius:8px;background:linear-gradient(90deg,var(--raised) 25%,var(--hover) 50%,var(--raised) 75%);background-size:200% 100%;animation:sk 1.2s linear infinite;}
  @keyframes sk{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
  @media (prefers-reduced-motion: reduce){.sk,.screen.active{animation:none;}}

  /* ---------- markets ---------- */
  /* indices: three compact tiles per row, so the whole set takes two short rows instead of half the screen */
  .idx{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;}
  .idx button{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:9px 10px;text-align:left;min-width:0;display:flex;flex-direction:column;gap:3px;}
  .idx button:active{background:var(--hover);}
  .idx .k{font-size:var(--caption);font-weight:600;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .idx .v{font-size:var(--body-plus);font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .idx .chip{height:20px;padding:0 6px;font-size:var(--caption);gap:2px;}
  @media (max-width:340px){ .idx{gap:6px;} .idx button{padding:8px 8px;} .idx .v{font-size:var(--body);} }
  .news a{display:block;padding:13px 14px;border-bottom:1px solid var(--border);color:inherit;text-decoration:none;}
  .news a:last-child{border-bottom:0;} .news a:active{background:var(--hover);}
  .news .t{font-size:var(--body);font-weight:500;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere;}
  .news .m{font-size:var(--small);color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* ---------- detail ---------- */
  .hero{padding:4px 2px 0;}
  .hero .px{font-size:var(--headline);font-weight:700;letter-spacing:-.02em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .hero .line{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px;}
  .hero .chg{font-size:var(--body-plus);font-weight:600;white-space:nowrap;}
  .hero .asof{font-size:var(--small);color:var(--muted);white-space:nowrap;}
  .hero .ext{font-size:var(--small-plus);color:var(--text2);margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .chart{margin:14px -4px 10px;position:relative;height:220px;touch-action:pan-y;}
  .chart canvas{width:100%;height:100%;display:block;}
  .chart .tip{position:absolute;top:0;left:0;right:0;text-align:center;font-size:var(--small-plus);font-weight:600;color:var(--text2);pointer-events:none;white-space:nowrap;}
  .chart .msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:var(--small-plus);text-align:center;padding:0 20px;}
  .stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));}
  .stats div{padding:11px 14px;border-bottom:1px solid var(--border);min-width:0;}
  .stats div:nth-child(odd){border-right:1px solid var(--border);}
  .stats div:nth-last-child(-n+2){border-bottom:0;}
  .stats div.wide{grid-column:1 / -1;border-right:0;}
  .stats dt{font-size:var(--small);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .stats dd{font-size:var(--body-plus);font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .stats div.wide dd{white-space:normal;overflow-wrap:anywhere;}
  .stats div.wide + div:not(.wide){border-right:1px solid var(--border);}
  .range{padding:14px;}
  .range + .range{border-top:1px solid var(--border);}
  .range .lbl{display:flex;justify-content:space-between;gap:8px;font-size:var(--small);color:var(--muted);}
  .range .lbl b{color:var(--text);font-weight:600;font-size:var(--small-plus);white-space:nowrap;}
  .range .track{position:relative;height:6px;border-radius:99px;background:var(--raised);margin:9px 0 7px;}
  .range .fill{position:absolute;top:0;bottom:0;border-radius:99px;background:var(--accent);opacity:.55;}
  .range .dot{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--text);border:3px solid var(--surface);transform:translate(-50%,-50%);box-shadow:0 0 0 1px var(--border-strong);}
  .er{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr) auto;align-items:center;gap:8px;padding:11px 14px;border-bottom:1px solid var(--border);font-size:var(--body);}
  .er:last-child{border-bottom:0;} .er.hd{font-size:var(--caption);font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:9px 14px;}
  .er span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;} .er span:nth-child(n+2){text-align:right;}
  #dEarn .er{grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:14px 16px;min-width:338px;}
  #dEarn .er.hd{padding-top:11px;padding-bottom:11px;}
  #dEarn .er>span{text-align:center;}
  #dEarn .er>span:first-child{text-align:left;}
  .note{font-size:var(--small);color:var(--muted);line-height:1.5;margin-top:10px;}

  /* ---------- search ---------- */
  .sbox{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;height:48px;padding:0 6px 0 14px;background:var(--surface);border:1px solid var(--border-strong);border-radius:14px;}
  .sbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-weak);}
  .sbox svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;}
  .sbox input{background:none;border:0;outline:0;font-size:var(--input-size);min-width:0;width:100%;user-select:text;}
  .sbox input::placeholder{color:var(--muted);}
  .recent{display:flex;flex-wrap:wrap;gap:8px;}
  .recent button{height:34px;padding:0 14px;border-radius:99px;background:var(--surface);border:1px solid var(--border);font-size:var(--small-plus);font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* ---------- more ---------- */
  .set{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding:14px;border-bottom:1px solid var(--border);}
  .set:last-child{border-bottom:0;}
  .set b{display:block;font-size:var(--body-plus);font-weight:600;} .set small{display:block;font-size:var(--small-plus);color:var(--muted);margin-top:2px;}
  .set .seg{min-width:150px;} .set .seg button{height:32px;font-size:var(--small-plus);padding:0 8px;}
  .about{padding:14px;font-size:var(--small-plus);color:var(--text2);line-height:1.55;} .about p + p{margin-top:8px;} .about b{color:var(--text);}
  /* ---------- drawer: every section, opened from the menu button ---------- */
  #scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .18s;z-index:20;}
  #drawer{position:fixed;top:0;bottom:0;left:0;width:min(84vw,320px);background:var(--surface);border-right:1px solid var(--border);transform:translateX(-102%);transition:transform .2s ease-out;z-index:21;
    display:flex;flex-direction:column;padding-top:var(--top);padding-bottom:var(--bottom);}
  body.dw #scrim{opacity:1;pointer-events:auto;} body.dw #drawer{transform:none;}
  .dw-head{height:var(--bar);flex:none;display:flex;align-items:center;padding:0 20px;font-size:var(--input-size);font-weight:700;letter-spacing:.22em;border-bottom:1px solid var(--border);}
  .mobile-brand,#title{background-image:url(equidex-inconsolata-dark.png);background-repeat:no-repeat;mix-blend-mode:lighten;}
  .mobile-brand{display:block;flex:none;width:176px;height:44px;max-height:100%;background-size:contain;background-position:left center;}
  #title{width:132px;height:28px;color:transparent;background-size:231.6px 82.4px;background-position:-87px -25.5px;}
  :root[data-theme="light"] .mobile-brand,:root[data-theme="light"] #title{background-image:url(equidex-inconsolata-light.png);mix-blend-mode:darken;}
  .dw-body{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 8px 16px;}
  .dw-g{font-size:var(--caption);font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:16px 12px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dw-g span{color:var(--accent);}
  #drawer button{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:12px;width:100%;height:48px;padding:0 12px;border-radius:12px;text-align:left;font-size:var(--body-plus);font-weight:500;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #drawer button b{width:34px;height:26px;border-radius:7px;display:grid;place-items:center;font-size:var(--caption);font-weight:700;letter-spacing:.04em;background:var(--raised);color:var(--muted);}
  #drawer button:active{background:var(--hover);}

<script>
// Enrich the existing screener candidate page; never imply a full-market rpo index.
const screenFundCache = new Map();
async function screenFundamentals(rows, bounds, region, paint) {
  const currency = region === 'in' ? 'INR' : 'USD';
  const request = async url => {
    const controller = new AbortController(), timer = setTimeout(() => controller.abort(), 110000);
    try { const r = await fetch(url, {signal: controller.signal}); if (!r.ok) return {}; return await r.json(); }
    catch (_) { return {}; } finally { clearTimeout(timer); }
  };
  const matches = row => ['fcf','rpo'].every(key => {
    const value=key==='fcf'?row.fcf:row.rpo?.value;
    const ccy=key==='fcf'?row.fcfCurrency:row.rpo?.currency;
    return ['min','max'].every(side=>bounds[key+'_'+side]==null ||
      (typeof value==='number' && Number.isFinite(value) && ccy===currency &&
       (side==='min'?value>bounds[key+'_'+side]:value<bounds[key+'_'+side])));
  });
  let next = 0, completed = 0;
  await Promise.all(Array.from({length: Math.min(3, rows.length)}, async () => {
    while (next < rows.length) {
      const row = rows[next++], key = row.symbol;
      let entry = screenFundCache.get(key);
      if (!entry || Date.now() - entry.at > 600000) {
        const [f,b] = await Promise.all([request('/api/yfund?symbol=' + encodeURIComponent(key) + '&fields=fcf'), region === 'in' ? request('/api/order-announcements?symbol=' + encodeURIComponent(key)) : {}]);
        entry = {at: Date.now(), fcf: f.fcf, fcfCurrency: f.fcfCurrency, rpo: b};
        screenFundCache.set(key, entry);
      }
      Object.assign(row, entry);
      completed++;
      if (paint) paint(rows.filter(matches),completed,rows.length);
    }
  }));
  return rows.filter(matches);
}
function screenFundMoney(value, currency) {
  if (typeof value !== 'number' || !Number.isFinite(value) || !currency) return '—';
  const unit = currency === 'INR' ? 1e7 : 1e9;
  return (currency === 'INR' ? '₹' : currency === 'USD' ? '$' : currency + ' ') +
    (value / unit).toLocaleString('en-US', {maximumFractionDigits: 2}) + (currency === 'INR' ? ' Cr' : 'B');
}

</script>

<script>
/* =====================================================================================================
   EQUIDEX mobile. Same data service as the desktop terminal (serve.py, relative /api/*), nothing invented:
   a value that is missing shows "—", a failed request falls back to the last saved response and says so.
   ===================================================================================================== */
const $ = (s, r=document) => r.querySelector(s), $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = v => String(v==null?'':v).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LS = { get(k,d){ try{ const v=localStorage.getItem('eqxm.'+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
             set(k,v){ const t=JSON.stringify(v);
               if(k.startsWith('c.') && t.length>400000) return;          // years of daily prices are not kept for offline use
               try{ localStorage.setItem('eqxm.'+k, t); }
               catch(e){ /* storage full: drop the offline copies, never the watchlist or the paper book, then retry */
                 try{ Object.keys(localStorage).filter(x=>x.startsWith('eqxm.c.')).forEach(x=>localStorage.removeItem(x)); localStorage.setItem('eqxm.'+k, t); }catch(e2){} } } };

/* ---------- state ---------- */
const DEFAULT_WATCH = { us:['AAPL','MSFT','NVDA','GOOGL','AMZN','META','TSLA','JPM'], in:['RELIANCE','TCS','INFY','HDFCBANK','ICICIBANK','SBIN','BHARTIARTL','ITC'] };
const INDICES = {
  us:[['^GSPC','S&P 500','SPX'],['^DJI','Dow Jones','DJI'],['^NDX','Nasdaq 100','NDX'],['^RUT','Russell 2000'],['^VIX','VIX'],['^TNX','US 10Y yield']],
  in:[['^NSEI','NIFTY 50','NIFTY'],['^BSESN','SENSEX','SENSEX'],['^NSEBANK','Bank Nifty'],['^CNXIT','Nifty IT'],['^INDIAVIX','India VIX']]
};
let MODE = LS.get('mode','us')==='in' ? 'in' : 'us';
let WATCH = { us:LS.get('watch.us',DEFAULT_WATCH.us), in:LS.get('watch.in',DEFAULT_WATCH.in) };
let NAMES = LS.get('names',{});          // symbol -> company name, learnt from quotes / search
let QUOTES = {};                          // yahoo symbol -> quote
let FLASH_ON = LS.get('flash',true)!==false;
let lastOk = 0, offline = false, editing = false, moverMode = 'gainers';
const MOVER_CAPS={};
const QUOTE_ASOF = {}, STALE_API = new Map();
const ysym = (s, m=MODE) => /^\^|[.=]/.test(s) ? s : (m==='in' ? s+'.NS' : s.replace('/','-'));
const isINR = sym => /\.(NS|BO)$/.test(sym) || ['^NSEI','^BSESN','^NSEBANK','^CNXIT','^INDIAVIX'].includes(sym);

/* ---------- formatting (display only) ---------- */
const NUMBER_FORMATS=new Map(), CLOCK_FORMATS=new Map();
const nf = (n,d,loc) => { const key=loc+'|'+d; let fmt=NUMBER_FORMATS.get(key);
  if(!fmt){fmt=new Intl.NumberFormat(loc,{minimumFractionDigits:d,maximumFractionDigits:d});NUMBER_FORMATS.set(key,fmt);} return fmt.format(n); };
const ok = n => typeof n==='number' && isFinite(n);
function money(n, sym, d){ if(!ok(n)) return '—'; const inr=isINR(sym); if(/^\^/.test(sym)) return nf(n, d==null?(Math.abs(n)>=1000?1:2):d, inr?'en-IN':'en-US');
  return (inr?'₹':'$') + nf(n, d==null?2:d, inr?'en-IN':'en-US'); }
const pct = p => ok(p) ? (p>0?'+':'') + p.toFixed(2) + '%' : '—';
const sgn = (n,d=2) => ok(n) ? (n>0?'+':'') + nf(n,d,'en-US') : '—';
const dir = n => !ok(n)||n===0 ? 'flat' : n>0 ? 'up' : 'down';
const arrow = n => !ok(n)||n===0 ? '' : n>0 ? '▲ ' : '▼ ';
function vol(v, sym){ if(!ok(v)||!v) return '—';
  if(isINR(sym)) return v>=1e7 ? (v/1e7).toFixed(2)+' Cr' : v>=1e5 ? (v/1e5).toFixed(1)+' L' : nf(v,0,'en-IN');
  return v>=1e9 ? (v/1e9).toFixed(2)+'B' : v>=1e6 ? (v/1e6).toFixed(1)+'M' : v>=1e3 ? (v/1e3).toFixed(0)+'K' : String(v); }
function cap(v, sym){ if(!ok(v)||!v) return '—';
  if(isINR(sym)) return '₹' + nf(Math.round(v/1e7),0,'en-IN') + ' Cr';
  return '$' + (v>=1e12 ? (v/1e12).toFixed(2)+'T' : v>=1e9 ? (v/1e9).toFixed(2)+'B' : (v/1e6).toFixed(1)+'M'); }
const ratio = (n,d=2) => ok(n) ? nf(n,d,'en-US') : '—';
const pc100 = f => ok(f) ? (f*100).toFixed(2)+'%' : '—';
const clock = (ts, tz, lbl) => { let fmt=CLOCK_FORMATS.get(tz);
  if(!fmt){fmt=new Intl.DateTimeFormat('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});CLOCK_FORMATS.set(tz,fmt);} return fmt.format(new Date(ts))+' '+lbl; };
const asOf = sym => isINR(sym) ? clock(Date.now(),'Asia/Kolkata','IST') : clock(Date.now(),'America/New_York','ET');
function status(q){ const m=(q&&q.mstate||'').toUpperCase();
  if(m==='REGULAR') return ['open','Open']; if(m==='PRE') return ['ext','Pre-market']; if(m==='POST') return ['ext','After hours']; return ['closed','Closed']; }

/* ---------- data: fetch with timeout, remember the last good answer for offline ---------- */
const API_PENDING=new Map();
let nativeOnline;
function internetAvailable(){
  try{ if(typeof window.EquidexPresentation?.isInternetAvailable==='function') return window.EquidexPresentation.isInternetAvailable(); }catch(e){}
  return nativeOnline===undefined ? navigator.onLine!==false : nativeOnline;
}
async function api(path, {ttl=0, timeout=15000, fresh=false, onData=null}={}){
  const key='c.'+path, hit=LS.get(key,null);
  if(!internetAvailable()){
    if(hit){if(connectionUiActive()) STALE_API.set(path,hit.t);setOffline(true,hit.t);if(onData) onData(hit.t,{cached:true});return hit.d;}
    setOffline(true);throw new Error('Internet connection unavailable');
  }
  if(hit && ttl && !fresh && Date.now()-hit.t < ttl){ if(onData) onData(hit.t,{cached:true}); return hit.d; }
  // Share only identical concurrent reads; forced refreshes and timeout budgets stay distinct.
  const requestKey=JSON.stringify([path,timeout,!!fresh]);
  let pending=API_PENDING.get(requestKey);
  if(!pending){
    pending=Promise.resolve().then(async()=>{
      const ctl=new AbortController(), to=setTimeout(()=>ctl.abort(), timeout);
      try{
        const r=await fetch(path,{signal:ctl.signal});
        if(!r.ok) throw new Error('HTTP '+r.status);
        const d=await r.json(); if(d && d.error) throw new Error(d.error);
        const ts=Date.now(); LS.set(key,{t:ts, d}); STALE_API.delete(path); setOffline(false); return {d,ts,cached:false};
      }catch(e){
        if(!internetAvailable()){
          if(hit){ if(connectionUiActive()){ STALE_API.set(path,hit.t); setOffline(true, hit.t); } return {d:hit.d,ts:hit.t,cached:true}; }
          setOffline(true);
        }else { STALE_API.delete(path); setOffline(false); }
        throw e;
      }finally{ clearTimeout(to); API_PENDING.delete(requestKey); }
    });
    API_PENDING.set(requestKey,pending);
  }
  const result=await pending; if(onData) onData(result.ts,{cached:result.cached}); return result.d;
}

let hostVisible=true, pageClosing=false;
function connectionUiActive(){ return hostVisible && !pageClosing && !document.hidden; }
function setOffline(on, ts){
  if(!connectionUiActive()) return;
  on=!internetAvailable();
  if(on && STALE_API.size) ts=Math.min(...STALE_API.values());
  if(!on) STALE_API.clear();
  offline=on; const b=$('#banner');
  b.classList.toggle('show', on);
  if(on) b.textContent = 'Offline — showing data as of ' + (ts||lastOk ? new Date(ts||lastOk).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',hour12:false}) : 'the last update');
}
window.addEventListener('online', ()=>{ setOffline(false); refresh(); });
window.addEventListener('offline', ()=> setOffline(true));
window.__eqNetworkChanged=available=>{
  const previous=nativeOnline;nativeOnline=!!available;setOffline(!nativeOnline);
  if(nativeOnline && previous===false && connectionUiActive()){refresh();liveTick();}
};
window.__eqHostVisibility=function(visible){
  hostVisible=visible;
  if(!visible){ $('#banner').classList.remove('show'); stopPolling(); }
  else { setOffline(!navigator.onLine); tickDisplayClocks(); liveTick(); }
};
window.addEventListener('pagehide', ()=>{pageClosing=true; $('#banner').classList.remove('show'); stopPolling();});
window.addEventListener('pageshow', ()=>{const returning=pageClosing; pageClosing=false; setOffline(!navigator.onLine); if(returning) liveTick();});
document.addEventListener('visibilitychange', ()=>{
  if(document.hidden) $('#banner').classList.remove('show');
  else setOffline(!navigator.onLine);
});

async function loadQuotes(syms){
  syms=[...new Set(syms)].filter(Boolean); if(!syms.length) return;
  let receivedAt=0, namesChanged=false, fromCache=false;
  const d=await api('/api/yquotes?symbols='+encodeURIComponent(syms.join(',')), {onData:(ts,source)=>{ receivedAt=ts; fromCache=source?.cached===true; }});
  for(const k in d){ if(d[k] && ok(d[k].price) && (!fromCache || !ok(QUOTES[k]?.price)) && (!QUOTE_ASOF[k] || receivedAt>=QUOTE_ASOF[k])){ QUOTES[k]=d[k]; QUOTE_ASOF[k]=receivedAt; if(d[k].name){ const nameKey=k.replace(/\.NS$/,''); if(NAMES[nameKey]!==d[k].name){NAMES[nameKey]=d[k].name; namesChanged=true;} } } }
  lastOk=Math.max(lastOk,receivedAt);
  if(namesChanged) LS.set('names',NAMES);
}

/* ---------- navigation: a small screen stack mapped onto history, so Android Back works ---------- */
let stack=[{s:'markets'}];
const TABS=['markets','watch','search','more','news','eco','fx','cal','inst','wire','screen','corr','paper','pf'];
function show(st, push){
  const el=$('#s-'+st.s);
  $$('.screen').forEach(x=>x.classList.toggle('active', x===el));
  el.scrollTop = st.keep ? el.scrollTop : 0;
  const isTab=TABS.includes(st.s);
  $('#tabs').classList.toggle('hide', !isTab);
  $$('#tabs button').forEach(b=>b.classList.toggle('on', b.dataset.tab===st.s));
  $('#back').hidden=isTab; $('#menuBtn').hidden=!isTab;
  $$('#drawer button[data-go]').forEach(b=>b.classList.toggle('on', b.dataset.go===st.s));
  $('#modeBtn').hidden=!isTab || st.s==='more' || st.s==='corr';
  $('#starBtn').hidden = !(st.s==='detail' && !st.index);
  $('#editBtn').hidden = st.s!=='watch';
  if(push) history.pushState(st,'');
  render(st);
  clearTimeout(liveT); liveT=setTimeout(liveTick, 1500);
}
function go(st){ editing=false; stack.push(st); show(st,true); }
function tab(s){ editing=false; stack=[{s}]; show(stack[0],true); }
const drawerOpen = () => document.body.classList.contains('dw');
function setDrawer(on){ document.body.classList.toggle('dw', on); $('#drawer').setAttribute('aria-hidden', on?'false':'true'); if(!on){ clearTimeout(liveT); liveT=setTimeout(liveTick, 400); } }
$('#menuBtn').addEventListener('click', ()=> setDrawer(true));
$('#scrim').addEventListener('click', ()=> setDrawer(false));
$('#drawer').addEventListener('click', e=>{
  const r=e.target.closest('button[data-res]'); if(r){ setDrawer(false); openRes(r.dataset.res, resSym()); return; }
  const b=e.target.closest('button[data-go]'); if(!b) return; setDrawer(false); tab(b.dataset.go); });
window.addEventListener('popstate', e=>{
  if(drawerOpen()){ setDrawer(false); history.pushState(stack[stack.length-1],''); return; }   // Back closes the drawer first
  if(stack.length>1) stack.pop(); else if(stack[0].s!=='markets') stack=[{s:'markets'}];
  show(Object.assign({keep:true}, stack[stack.length-1]), false);
});
$('#back').addEventListener('click', ()=>history.back());
$('#tabs').addEventListener('click', e=>{ const b=e.target.closest('button'); if(b) tab(b.dataset.tab); });
$('#modeBtn').addEventListener('click', ()=> setMode(MODE==='us'?'in':'us'));
function setMode(m){ MODE=m; LS.set('mode',m); $('#modeBtn').textContent=m==='in'?'INDIA':'US'; toast(m==='in'?'India market':'US market'); render(stack[stack.length-1]); }
let toastT; function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1800); }

function render(st){
  if(st.s==='markets') renderMarkets();
  else if(st.s==='watch') renderWatch();

/* ---------- live prices ----------
   Every price carries data-px="<symbol>" (and its change chip data-ch). One pass collects ONLY the symbols whose
   price is inside the visible part of the screen right now — rows scrolled out of view, the screen behind the
   open drawer and a stock page scrolled past its price are not polled — asks for them in a single request,
   rewrites only the text that changed and flashes it.
   Pace: every 3 s while any of those markets is trading (regular, pre- or post-market, FX), every 15 s when
   they are all closed; no request at all when nothing with a price is in view or the app is in the background.
   Scrolling re-runs the pass so rows that come into view update straight away. */
const SHOWN={};                                   // symbol -> price last painted (to know what changed)
const fxFmt = v => ok(v) ? nf(v, v>=20?2:4, 'en-US') : '—';
function flash(el, up){ if(!el || !FLASH_ON) return; el.classList.remove('fu','fd'); void el.offsetWidth; el.classList.add(up?'fu':'fd'); }
function paintLive(){
  const scr=$('.screen.active'); if(!scr) return;
  $$('[data-px]', scr).forEach(el=>{ const y=el.dataset.px, q=QUOTES[y]; if(!q) return;
    const txt = el.dataset.fx ? fxFmt(q.price) : money(q.price,y);
    if(el.textContent!==txt){ el.textContent=txt; if(ok(SHOWN[y]) && SHOWN[y]!==q.price) flash(el, q.price>SHOWN[y]); } });
  $$('[data-ch]', scr).forEach(el=>{ const q=QUOTES[el.dataset.ch]; if(!q) return;
    const txt=arrow(q.pct)+pct(q.pct).replace(/^[+-]/,''); if(el.textContent!==txt){ el.textContent=txt; el.className='chip '+dir(q.pct)+' num'; } });
  $$('[data-px]', scr).forEach(el=>{ const q=QUOTES[el.dataset.px]; if(q) SHOWN[el.dataset.px]=q.price; });
  const st=stack[stack.length-1];
  if(st.s==='markets'){ const i0=INDICES[MODE][0][0], q0=QUOTES[i0], ms=$('#mkStatus'); if(q0 && ms){ const s2=status(q0); ms.innerHTML=`<span class="chip status ${s2[0]}">${s2[1]}</span> <span data-live-clock="${esc(i0)}">${esc(asOf(i0))}</span>`; } }
  else if(st.s==='watch'){ const m=$('#s-watch .h .meta'); if(m && WATCH[MODE].length) m.textContent=asOf(ysym(WATCH[MODE][0])); }
  else if(st.s==='fx'){ const m=$('#fxAs'); if(m) m.textContent=fxAsOf(); }
}

function inView(el){                               // is any part of this element inside the visible screen area?
  if(!el) return false;

  return r.height>0 && r.bottom>v.top && r.top<v.bottom && r.right>v.left && r.left<v.right;
}

function bindWatchDrag(el,mode){
  if(el.dataset.dragBound)return;el.dataset.dragBound='1';

  el.addEventListener('pointerdown',e=>{
    const h=e.target.closest('[data-watch-drag]');if(!h||!editing||el.dataset.dragging==='1'||e.button!==0||e.target.closest('.rm'))return;
    e.preventDefault();const row=h.closest('.row');drag={h,row,id:e.pointerId,sym:h.dataset.watchDrag,mode:MODE,before:WATCH[MODE].slice(),startTop:row.getBoundingClientRect().top,startY:e.clientY};el.dataset.dragging='1';row.classList.add('dragging');h.setPointerCapture(e.pointerId);

    const rows=[...el.querySelectorAll('.row.edit')],card=drag.row.parentElement,top=card.getBoundingClientRect().top;
    const positions=new Map(rows.map(r=>[r,r.offsetTop]));
    const center=drag.startTop+(e.clientY-drag.startY)+drag.row.offsetHeight/2;
    const others=rows.filter(r=>r!==drag.row),current=rows.indexOf(drag.row);
    const to=others.filter((r,i)=>center>top+r.offsetTop+r.offsetHeight*(i<current?.65:.35)).length;
    const list=WATCH[drag.mode],from=list.indexOf(drag.sym);
    if(to!==from){
      list.splice(from,1);list.splice(to,0,drag.sym);
      if(to<others.length)others[to].before(drag.row);else card.append(drag.row);
      if(!matchMedia('(prefers-reduced-motion: reduce)').matches)others.forEach(r=>{const dy=positions.get(r)-r.offsetTop;if(dy){r.getAnimations().forEach(a=>a.cancel());r.animate([{transform:'translateY('+dy+'px)'},{transform:'translateY(0)'}],{duration:160,easing:'cubic-bezier(.2,.8,.2,1)'});}});
    }
    drag.row.style.transform='translateY('+(drag.startTop+e.clientY-drag.startY-(top+drag.row.offsetTop))+'px)';
    const bounds=el.getBoundingClientRect();if(e.clientY<bounds.top+48)el.scrollTop-=12;else if(e.clientY>bounds.bottom-48)el.scrollTop+=12;
  });
  const finish=e=>{if(!drag||e.pointerId!==drag.id)return;const d=drag;drag=null;delete el.dataset.dragging;if(e.type==='pointercancel')WATCH[d.mode]=d.before;else LS.set('watch.'+d.mode,WATCH[d.mode]);if(d.h.hasPointerCapture(d.id))d.h.releasePointerCapture(d.id);const dy=d.row.style.transform;d.row.style.transform='';if(dy&&!matchMedia('(prefers-reduced-motion: reduce)').matches){el.dataset.dragging='1';const a=d.row.animate([{transform:dy},{transform:'translateY(0)'}],{duration:180,easing:'cubic-bezier(.2,.8,.2,1)'});a.onfinish=()=>{delete el.dataset.dragging;renderWatch();};}else renderWatch();};
  el.addEventListener('pointerup',finish);el.addEventListener('pointercancel',finish);
  el.addEventListener('keydown',e=>{const h=e.target.closest('[data-watch-drag]');if(!h||e.target.closest('.rm')||!['ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();const list=WATCH[MODE],i=list.indexOf(h.dataset.watchDrag),j=i+(e.key==='ArrowUp'?-1:1);if(j<0||j>=list.length)return;[list[i],list[j]]=[list[j],list[i]];LS.set('watch.'+MODE,list);renderWatch().then(()=>el.querySelector('[data-watch-drag="'+h.dataset.watchDrag+'"]')?.focus());});
}

function updateLiveChart(sym){

async function renderDiv(st){

  if(el.dataset.sym!==sym) return; el.dataset.done='1';
  const ev=(d.events||[]).slice().sort((a,b)=>b.ts-a.ts), yrs=(d.years||[]).slice().sort((a,b)=>b.year-a.year);
  if(!ev.length){ $('#dvOut').innerHTML='<div class="card"><div class="empty"><b>No dividends</b>This company has not paid a dividend in the last 10 years.</div></div>'; return; }
  const amt=v=> ok(v) ? (inr?'₹':'$')+v.toLocaleString(loc,{minimumFractionDigits:2,maximumFractionDigits:4}) : '—';
  const cell=(k,v,wide)=>`<div${wide?' class="wide"':''}><dt>${k}</dt><dd class="num">${v}</dd></div>`;
  /* growth: between the first and last COMPLETE calendar years — this year is still running, and the oldest year

  const now=new Date().getFullYear(), full=(d.years||[]).slice().sort((a,b)=>a.year-b.year).filter(y=>y.year<now && y.total>0).slice(1);

  else if(full.length>=2){ const a=full[0], b=full[full.length-1], g=(Math.pow(b.total/a.total, 1/(b.year-a.year))-1)*100; if(ok(g)){ gr=pct(g); grLbl+=` · ${a.year}–${b.year}`; } }
  const mx=Math.max(...yrs.map(y=>y.total));
  $('#dvOut').innerHTML=`<dl class="card stats">${cell('Paid, last 12 months', ok(d.ttm)&&d.ttm>0?amt(d.ttm):'—')}${cell('Yield', ok(d.yield)?d.yield.toFixed(2)+'%':'—')}${cell('Frequency', esc(d.frequency||'—'))}${cell(grLbl, gr)}${cell('Latest payment', amt(ev[0].amount)+' · '+esc(ev[0].date), true)}</dl>
    <div class="h"><h2>By year</h2><span class="meta">per share</span></div><div class="card">${yrs.map(y=>`<div class="yb"><span class="y num">${y.year}${y.year===now?' so far':''}</span><span class="bar"><i style="width:${mx>0?Math.max(2,y.total/mx*100):0}%"></i></span><span class="a num">${amt(y.total)}</span></div>`).join('')}</div>
    <div class="h"><h2>Payments</h2><span class="meta">${ev.length} in 10 years</span></div><div class="card">${ev.map(e=>`<div class="kv"><span class="num">${esc(e.date)}</span><span class="num">${amt(e.amount)}</span></div>`).join('')}</div>
    <p class="note">Yahoo Finance, last 10 years, per share and adjusted for splits. Dates are ex-dividend dates. Yield is the last 12 months' dividends against the current price.</p>`;
}

function paintHoldIn(sym){

/* ---------- Analyst ratings ---------- */
async function renderAnr(st){
  const el=$('#s-anr'), sym=st.sym;
  if(!resOpen(el, st, 'Analyst ratings', `<div id="anOut">${skRows(4)}</div>`)) return;
  let d; try{ d=await api('/api/analyst?symbol='+enc(sym),{ttl:3600000, timeout:30000, fresh:!!st.force}); }
  catch(e){ if(el.dataset.sym===sym) $('#anOut').innerHTML=errBox('Analyst data could not be loaded.','anr'); return; }
  if(el.dataset.sym!==sym) return; el.dataset.done='1';
  const D=d.dist||{}, votes=['strongBuy','buy','hold','sell','strongSell'].reduce((t,k)=>t+(D[k]||0),0), hasT=d.targetMean>0 && d.price>0;
  if(!votes && !hasT){ $('#anOut').innerHTML=emptyCard('No analyst coverage','Yahoo Finance publishes no consensus for this company.'); return; }
  const cur=ccySym(d.currency), loc=d.currency==='INR'?'en-IN':'en-US', px=v=>ok(v)?cur+nf(v,2,loc):'—';
  let h='';
  if(votes || ok(d.recMean)){
    const lbl = d.recKey ? d.recKey.replace(/_/g,' ') : (d.recMean<=1.5?'strong buy':d.recMean<=2.5?'buy':d.recMean<=3.5?'hold':d.recMean<=4.5?'sell':'strong sell');
    const col = !ok(d.recMean) ? 'var(--text)' : d.recMean<=2.5 ? 'var(--gain)' : d.recMean<=3.5 ? 'var(--flag)' : 'var(--loss)';
    const mark = ok(d.recMean) ? Math.max(0,Math.min(100,(5-d.recMean)/4*100)) : null;
    h+=`<div class="h"><h2>Consensus</h2><span class="meta">${d.numAnalysts?d.numAnalysts+' analysts':''}</span></div><div class="card pad"><div class="big" style="color:${col};text-transform:capitalize">${esc(lbl)}</div>`
      + (mark!=null ? `<div class="gauge"><i style="left:${mark.toFixed(1)}%"></i></div><div class="gscale"><span>Strong sell</span><span>Hold</span><span>Strong buy</span></div><p class="note" style="margin-top:8px">Mean score ${d.recMean.toFixed(2)} on a scale of 1 (strong buy) to 5 (strong sell).</p>` : '') + '</div>';
  }
  if(votes){
    const R=[['Strong buy',D.strongBuy||0,'var(--gain)',1],['Buy',D.buy||0,'var(--gain)',.55],['Hold',D.hold||0,'var(--flag)',1],['Sell',D.sell||0,'var(--loss)',.55],['Strong sell',D.strongSell||0,'var(--loss)',1]];
    const pc=c=>Math.round(c/votes*100), bull=(D.strongBuy||0)+(D.buy||0), bear=(D.sell||0)+(D.strongSell||0);
    h+=`<div class="h"><h2>Ratings</h2><span class="meta">${votes} analysts</span></div><div class="card"><div class="stk">${R.filter(r=>r[1]).map(r=>`<i style="flex:${r[1]} 0 0;background:${r[2]};opacity:${r[3]}"></i>`).join('')}</div>`
      + R.map(r=>`<div class="hc"><i style="background:${r[2]};opacity:${r[3]}"></i><span class="nm2">${r[0]}</span><span class="pc num">${r[1]}</span><span class="cg num flat">${pc(r[1])}%</span></div>`).join('')
      + `<div class="kv"><span>Bullish · neutral · bearish</span><span class="num"><span class="up">${pc(bull)}%</span> · ${pc(D.hold||0)}% · <span class="down">${pc(bear)}%</span></span></div></div>`;
  }
  if(hasT){
    const p=d.price, m=d.targetMean, up=(m-p)/p*100, lo=Math.min(ok(d.targetLow)?d.targetLow:m,p), hi=Math.max(ok(d.targetHigh)?d.targetHigh:m,p), span=(hi-lo)||1, pos=v=>Math.max(0,Math.min(100,(v-lo)/span*100));
    h+=`<div class="h"><h2>12-month price target</h2></div><dl class="card stats">${cellKV('Price now',px(p))}${cellKV('Mean target',px(m))}${cellKV('Upside to mean',`<span class="${dir(up)}">${pct(up)}</span>`)}${cellKV('Median target',px(d.targetMedian))}${cellKV('Low target',px(d.targetLow))}${cellKV('High target',px(d.targetHigh))}</dl>
      <div class="card range" style="margin-top:10px"><div class="lbl"><span>Low <b class="num">${px(lo)}</b></span><span>High <b class="num">${px(hi)}</b></span></div>
      <div class="track"><div class="fill" style="left:${Math.min(pos(p),pos(m))}%;width:${Math.abs(pos(m)-pos(p))}%;background:${up>=0?'var(--gain)':'var(--loss)'}"></div><div class="dot" style="left:${pos(p)}%"></div><div class="dot tg" style="left:${pos(m)}%"></div></div>
      <div class="lbl"><span><i class="lg" style="background:var(--text)"></i>Price now</span><span><i class="lg" style="background:var(--accent)"></i>Mean target</span></div></div>`;
  }
  $('#anOut').innerHTML = h + '<p class="note">Yahoo Finance analyst consensus: recommendation trend and 12-month price targets. Coverage is broadest for large US companies.</p>';
}

function calDate(v){ let m;

  return v||''; }

function tmChart(ys, ye, mark, bands){

  return `<svg class="svgc" id="tmSvg" viewBox="0 0 ${W} ${Ht}" role="img" aria-label="Price in ${TM.year}; tap a day">${g}<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="1.6"/>${m}</svg>`;
}

function corrScatter(rA,rB,A,B,beta){

    <text x="${pl+iw/2}" y="${H-6}" fill="var(--muted)" style="font-size:var(--caption)" text-anchor="middle">${esc(A)} daily return</text>

   Paper trading — simulated cash, live prices. The desktop's rules: two currency-pure books (US $ and India ₹)

const optLabel = o => o.under+' '+optDate(o.exp)+' '+(+o.strike)+o.right;

  for(const b of ['usd','inr']){ if(!d[b]||typeof d[b]!=='object') d[b]={cash:PAPER_START[b], start:PAPER_START[b], realized:0, positions:{}, trades:[]};
    d[b].positions=d[b].positions||{}; d[b].trades=d[b].trades||[];
    if(typeof d[b].cash!=='number') d[b].cash=PAPER_START[b]; if(typeof d[b].start!=='number') d[b].start=PAPER_START[b]; if(typeof d[b].realized!=='number') d[b].realized=0; }
  return d; }

async function ppMark(){

  if(PP.quoted && !isOptKey(PP.quoted.sym)) stocks.add(PP.quoted.sym);
  if(stocks.size) await loadQuotes([...stocks]);
  for(const k of stocks){ const q=QUOTES[k]; if(q) PP.px[k]={price:q.price, prev:q.prev, name:q.name}; }
  for(const g in groups){ const [u,e]=g.split('|');
    try{ const d=await fetchFresh('/api/options?symbol='+enc(u)+'&date='+e, 30000), by={};
      (d.calls||[]).forEach(c=>by['C'+c.strike]=c); (d.puts||[]).forEach(c=>by['P'+c.strike]=c);
      groups[g].forEach(({k,o})=>{ const leg=by[o.right+o.strike], pr=optMid(leg); if(pr!=null) PP.px[k]={price:pr, prev:(leg&&ok(leg.change))?pr-leg.change:null, name:optLabel(o)}; }); }catch(err){} }

/* ---- portfolio maths (identical in the desktop and mobile frontends) ----
   FIFO lots per symbol: buy charges are added to cost, sell charges deducted from proceeds. Each currency is its own
   book and nothing is converted between currencies, so no exchange rate is ever assumed. */
const PF_CCY={USD:'$',INR:'₹',EUR:'€',GBP:'£',JPY:'¥',CAD:'C$',AUD:'A$',HKD:'HK$',SGD:'S$',CHF:'CHF '};
const pfOk=n=>typeof n==='number' && isFinite(n);
const pfEsc=v=>String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pfToday=()=>{ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const pfDays=(a,b)=>Math.round((Date.parse(b+'T00:00:00Z')-Date.parse(a+'T00:00:00Z'))/864e5);
function pfAddMonths(iso,m){ const p=iso.split('-').map(Number); return new Date(Date.UTC(p[0],p[1]-1+m,p[2])).toISOString().slice(0,10); }
/* holding period under Indian income-tax rules for a resident: shares listed in India are long-term after 12 months,
   other shares (including foreign shares) after 24 months */
const pfTerm=(sym,buy,sell)=> sell > pfAddMonths(buy, /\.(NS|BO)$/.test(sym)?12:24) ? 'Long' : 'Short';
const pfFy=iso=>{ const y=+iso.slice(0,4), m=+iso.slice(5,7), s=m>=4?y:y-1; return s+'-'+String((s+1)%100).padStart(2,'0'); };   // Indian FY, Apr–Mar
const pfLoc=ccy=>ccy==='INR'?'en-IN':'en-US';
function pfMoney(n,ccy){ if(!pfOk(n)) return '—'; return (n<0?'−':'')+(PF_CCY[ccy]||(ccy+' '))+Math.abs(n).toLocaleString(pfLoc(ccy),{minimumFractionDigits:2,maximumFractionDigits:2}); }
const pfSigned=(n,ccy)=>!pfOk(n)?'—':(n>0?'+':'')+pfMoney(n,ccy);
const pfPct=v=>!pfOk(v)?'—':(v>0?'+':v<0?'−':'')+Math.abs(v).toFixed(2)+'%';
const pfQty=(q,ccy)=>!pfOk(q)?'—':q.toLocaleString(pfLoc(ccy),{maximumFractionDigits:4});
const pfCls=n=>!pfOk(n)||n===0?'flat':n>0?'up':'down';
/* splits and bonus issues per symbol, filled from /api/splits by each frontend:
   {sym: [{date, kind:'split'|'bonus', num, den, src, confirmed}] | null when the lookup failed} */
const PF_EV={};
const pfRatio=a=>{ if(a.kind==='bonus') return `${a.num-a.den}:${a.den} bonus`; const r=a.num/a.den;
  return Number.isInteger(+r.toFixed(9))?`${+r.toFixed(9)} for 1`:Number.isInteger(+(1/r).toFixed(9))?`1 for ${+(1/r).toFixed(9)}`:`${a.num} for ${a.den}`; };
function pfCompute(txns, ev){
  ev=ev||PF_EV;
  const by={}, realised=[], errors=[], applied=[];
  /* trades are entered as they happened (share count and price of their day); a split or bonus applies at the start
     of its ex-date, so it reaches every lot bought before that day and none bought on or after it */
  const evs=[]; [...new Set(txns.map(t=>t.sym))].forEach(sym=>(ev[sym]||[]).forEach(e=>{ if(e.num>0 && e.den>0 && e.num!==e.den) evs.push(Object.assign({}, e, {sym, side:'event', id:-1})); }));
  const rank=t=>t.side==='event'?0:1;
  const list=txns.concat(evs).sort((a,b)=> a.date<b.date?-1:a.date>b.date?1:(rank(a)-rank(b))||(a.id-b.id));
  for(const t of list){
    if(t.side==='event'){
      const p=by[t.sym], held=p?p.lots.reduce((s,l)=>s+l.qty,0):0; if(held<=1e-9) continue;
      const r=t.num/t.den, a={sym:t.sym, ccy:p.ccy, date:t.date, kind:t.kind, num:t.num, den:t.den, src:t.src, confirmed:t.confirmed!==false, held};
      if(t.kind==='bonus'){
        // a bonus already entered by hand as a buy at price 0 within 30 days of the ex-date is not added twice
        if(txns.some(x=>x.sym===t.sym && x.side==='buy' && x.price===0 && x.date>=t.date && pfDays(t.date,x.date)<=30)) continue;
        const extra=Math.floor(held*(r-1)+1e-9);   // fractional entitlements are paid out in cash
        if(extra>0) p.lots.push({qty:extra, cps:0, date:t.date});   // nil cost, held from allotment
        a.after=held+extra;
      } else { p.lots.forEach(l=>{ l.qty*=r; l.cps/=r; }); a.after=held*r; }   // same purchase date, same total cost
      applied.push(a); continue;
    }
    const p=by[t.sym]=by[t.sym]||{sym:t.sym, ccy:t.ccy, name:t.name||'', lots:[], realised:0};
    if(t.name) p.name=t.name;
    if(t.side==='buy'){ p.lots.push({qty:t.qty, cps:(t.qty*t.price+(t.fees||0))/t.qty, date:t.date}); continue; }
    let q=t.qty; const pps=(t.qty*t.price-(t.fees||0))/t.qty;
    while(q>1e-9 && p.lots.length){
      const l=p.lots[0], take=Math.min(q,l.qty), cost=take*l.cps, proceeds=take*pps;
      realised.push({sym:t.sym, ccy:t.ccy, qty:take, buyDate:l.date, sellDate:t.date, cost, proceeds, gain:proceeds-cost, days:pfDays(l.date,t.date), term:pfTerm(t.sym,l.date,t.date)});
      p.realised+=proceeds-cost; l.qty-=take; q-=take; if(l.qty<=1e-9) p.lots.shift();
    }
    if(q>1e-9) errors.push(t.id);   // sold more than was held on that date
  }
  const holdings=Object.values(by).map(p=>{ const qty=p.lots.reduce((s,l)=>s+l.qty,0), cost=p.lots.reduce((s,l)=>s+l.qty*l.cps,0);
    return Object.assign({}, p, {qty, cost, avg:qty>1e-9?cost/qty:null}); });
  return {holdings, realised, errors, applied};
}
/* XIRR by bisection; null when it cannot be meaningful (under 30 days of history, or no sign change) */
function pfXirr(flows){
  if(flows.length<2 || !flows.some(f=>f.v<0) || !flows.some(f=>f.v>0)) return null;
  const t0=Math.min(...flows.map(f=>f.t)), span=(Math.max(...flows.map(f=>f.t))-t0)/864e5; if(span<30) return null;
  const npv=r=>flows.reduce((s,f)=>s+f.v/Math.pow(1+r,(f.t-t0)/(365*864e5)),0);
  let lo=-0.9999, hi=10, flo=npv(lo), fhi=npv(hi);
  if(!isFinite(flo) || !isFinite(fhi) || flo*fhi>0) return null;
  for(let i=0;i<200;i++){ const mid=(lo+hi)/2, fm=npv(mid); if(Math.abs(fm)<1e-7) return mid; if(fm*flo<0){ hi=mid; } else { lo=mid; flo=fm; } }
  return (lo+hi)/2;
}
/* one book per currency: open positions valued at the live price; value, unrealised and XIRR only when every holding has a price */
function pfBooks(txns, comp, px){
  const B={}, book=c=>B[c]=B[c]||{ccy:c, rows:[], invested:0, value:0, priced:true, day:0, dayAll:true, ext:0, extN:0, extKind:null, realised:0, flows:[], txns:0};
  comp.holdings.forEach(h=>{ const b=book(h.ccy); b.realised+=h.realised;
    if(h.qty<=1e-9) return;
    // last = latest trade (pre-market / after hours outside the session); close = the regular-session price it follows
    const q=px[h.sym]||{}, last=pfOk(q.price)?q.price:null, ext=(last!=null && q.ext && pfOk(q.close))?q.ext:null, close=ext?q.close:last,
          value=last!=null?h.qty*last:null, day=(close!=null && pfOk(q.prev))?h.qty*(close-q.prev):null, extChg=ext?h.qty*(last-close):null;
    b.rows.push(Object.assign({}, h, {last, close, prev:q.prev, ext, extChg, value, day, unreal:value!=null?value-h.cost:null}));
    b.invested+=h.cost; if(value==null) b.priced=false; else b.value+=value; if(day==null) b.dayAll=false; else b.day+=day;
    if(ext){ b.ext+=extChg; b.extN++; b.extKind=(b.extKind && b.extKind!==ext)?'mixed':ext; } });
  txns.forEach(t=>{ const b=book(t.ccy), amt=t.qty*t.price; b.txns++;
    b.flows.push({t:Date.parse(t.date+'T12:00:00'), v:t.side==='buy'?-(amt+(t.fees||0)):(amt-(t.fees||0))}); });
  Object.values(B).forEach(b=>{
    const tot=b.priced?b.value:null;
    b.rows.sort((x,y)=>(pfOk(y.value)?y.value:y.cost)-(pfOk(x.value)?x.value:x.cost));
    b.rows.forEach(r=>{ r.weight=(tot && r.value!=null)?r.value/tot*100:null; });
    b.unreal=b.priced?b.value-b.invested:null;
    b.prevValue=(b.priced && b.dayAll)?b.value-b.ext-b.day:null;
    b.extBase=(b.priced && b.extN)?b.value-b.ext:null;
    b.xirr=b.priced?pfXirr(b.flows.concat(b.rows.length?[{t:Date.now(), v:b.value}]:[])):null;
    if(!b.priced){ b.value=null; b.day=null; }
    if(!b.priced || !b.extN) b.ext=null;
    if(!b.dayAll) b.day=null;
  });
  return Object.values(B).sort((a,b)=>a.ccy.localeCompare(b.ccy));
}
/* CSV: date,side,symbol,quantity,price,charges[,currency,name]; dates as YYYY-MM-DD, DD-MM-YYYY, DD/MM/YYYY or DD-Mon-YYYY */
function pfCsvRows(text){
  const out=[]; let row=[], cell='', q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ cell+='"'; i++; } else q=false; } else cell+=ch; continue; }
    if(ch==='"') q=true; else if(ch===','){ row.push(cell); cell=''; } else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&text[i+1]==='\n') i++; row.push(cell); cell=''; if(row.some(c=>c.trim()!=='')) out.push(row); row=[]; } else cell+=ch; }
  row.push(cell); if(row.some(c=>c.trim()!=='')) out.push(row);
  return out;
}
function pfCsvDate(v){ v=String(v||'').trim(); let m;
  const MON={jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,oct:10,nov:11,dec:12};
  if((m=/^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(v))) return [+m[1],+m[2],+m[3]];
  if((m=/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})$/.exec(v))) return [+m[3],+m[2],+m[1]];
  if((m=/^(\d{1,2})[- ]([A-Za-z]{3})[a-z]*[- ](\d{4})$/.exec(v)) && MON[m[2].toLowerCase()]) return [+m[3],MON[m[2].toLowerCase()],+m[1]];
  return null; }
const pfIso=p=>{ if(!p) return null; const [y,mo,d]=p; if(mo<1||mo>12||d<1||d>31) return null; const iso=y+'-'+String(mo).padStart(2,'0')+'-'+String(d).padStart(2,'0');
  return new Date(Date.UTC(y,mo-1,d)).toISOString().slice(0,10)===iso ? iso : null; };
const pfCsvCell=v=>/[",\n]/.test(String(v))?'"'+String(v).replace(/"/g,'""')+'"':String(v);
function pfToCsv(txns){ return ['date,side,symbol,quantity,price,charges,currency,name'].concat(txns.slice().sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.id-b.id)
  .map(t=>[t.date,t.side,t.sym,t.qty,t.price,t.fees||0,t.ccy,t.name||''].map(pfCsvCell).join(','))).join('\n'); }

// Looks up split / bonus history for symbols not yet known (a failed lookup is stored as null and retried on the next visit)
async function pfEnsureEvents(syms){
  const need=[...new Set(syms)].filter(s=>!(s in PF_EV)); if(!need.length) return;
  for(let i=0;i<need.length;i+=40){ const part=need.slice(i,i+40);
    try{ const d=await fetchFresh('/api/splits?symbols='+enc(part.join(',')), 30000); part.forEach(s=>{ PF_EV[s]=Array.isArray(d[s])?d[s]:null; }); }
    catch(e){ part.forEach(s=>{ PF_EV[s]=null; }); } }
}
function pfEventsCheck(txns){
  const need=[...new Set(txns.map(t=>t.sym))].filter(s=>!(s in PF_EV));
  if(!need.length || PF.evBusy) return;
  PF.evBusy=true; pfEnsureEvents(need).finally(()=>{ PF.evBusy=false; paintPf(); });
}
function pfDelete(id, b){
  if(PF.arm!==id){ PF.arm=id; $$('#pfTx [data-pfdel]').forEach(x=>x.textContent='Delete'); b.textContent='Tap again';
    clearTimeout(pfDelete.t); pfDelete.t=setTimeout(()=>{ PF.arm=null; if(b.isConnected) b.textContent='Delete'; },4000); return; }
  PF.arm=null; clearTimeout(pfDelete.t);
  const d=pfLoad(), rest=d.txns.filter(t=>t.id!==id);
  if(pfCompute(rest).errors.length){ pfMsg('err','A later sale depends on this purchase — delete that sale first.'); paintPf(); return; }
  d.txns=rest; LS.set('portfolio', d); toast('Transaction deleted'); paintPf();
}

/* ---------- chart: canvas line with a touch crosshair ---------- */
async function loadChart(sym){
  if(chartState.range==='LIVE'){chartState.pts=null;chartState.hasSessionOpen=false;updateLiveChart(sym);return;}
  const r=RANGES.find(x=>x[0]===chartState.range), msg=$('#dMsg'); msg.textContent='Loading chart…'; msg.style.display='grid'; chartState.pts=null; drawChart();
  try{
    async function pull(cfg){
      try{
        const j=await api(`/api/yahoo?symbol=${encodeURIComponent(sym)}&range=${cfg[1]}&interval=${cfg[2]}`,{ttl:cfg[0]==='1D'?30000:300000});
        const res=j?.chart?.result?.[0], ts=res?.timestamp||[], cl=res?.indicators?.quote?.[0]?.close||[], pts=[];
        for(let i=0;i<ts.length;i++) if(ok(cl[i])) pts.push([ts[i]*1000, cl[i]]);
        return {res,pts};
      }catch(e){ return {res:null,pts:[]}; }
    }
    let out=await pull(r);
    let sessionBase=null;
    if(r[0]==='1D'){
      // Retrieve recent intraday history, but display only its latest exchange-local day.
      const usedFallback=out.pts.length<2;
      if(usedFallback) out=await pull(['1D','5d','5m']);
      if(out.pts.length){
        const tz=out.res?.meta?.exchangeTimezoneName || (isINR(sym)?'Asia/Kolkata':'America/New_York');
        const day=t=>new Date(t).toLocaleDateString('en-CA',{timeZone:tz});
        const latest=day(out.pts[out.pts.length-1][0]);
        const prior=out.pts.filter(p=>day(p[0])!==latest);
        out.pts=out.pts.filter(p=>day(p[0])===latest);
        sessionBase=usedFallback ? (prior.length?prior[prior.length-1][1]:out.pts[0][1]) : out.res?.meta?.chartPreviousClose;
      }
    }
    const fallback={'1W':['1M']};
    if(out.pts.length<=2 && fallback[r[0]]) for(const key of fallback[r[0]]){
      if($('#s-detail').dataset.sym!==sym || chartState.range!==r[0]) return;
      out=await pull(RANGES.find(x=>x[0]===key));
      if(out.pts.length>2) break;
    }
    const {res,pts}=out;
    if($('#s-detail').dataset.sym!==sym || chartState.range!==r[0]) return;
    if(pts.length<2){ msg.textContent=res?'No chart data for this period.':'The chart could not be loaded.'; return; }
    let hasSessionOpen=false;
    if(r[0]==='1D'){
      try{
        const daily=await api(`/api/yahoo?symbol=${encodeURIComponent(sym)}&range=1mo&interval=1d`,{ttl:30000});
        const d=daily?.chart?.result?.[0], tz=res?.meta?.exchangeTimezoneName || (isINR(sym)?'Asia/Kolkata':'America/New_York');
        const day=t=>new Date(t).toLocaleDateString('en-CA',{timeZone:tz});
        const first=(d?.timestamp||[]).findIndex(t=>day(t*1000)===day(pts[0][0]));
        const sessionOpen=d?.indicators?.quote?.[0]?.open?.[first];
        if(ok(sessionOpen)){ pts.unshift([pts[0][0],sessionOpen]); hasSessionOpen=true; }
      }catch(e){}
    }
    if($('#s-detail').dataset.sym!==sym || chartState.range!==r[0]) return;
    chartState.hasSessionOpen=hasSessionOpen;
    chartState.pts=pts; chartState.base = r[0]==='1D' && ok(sessionBase) ? sessionBase : pts[0][1];
    chartState.tz=res?.meta?.exchangeTimezoneName || (isINR(sym)?'Asia/Kolkata':'America/New_York');
    msg.style.display='none'; drawChart();
  }catch(e){ msg.textContent='The chart could not be loaded.'; }
}
function drawChart(hover){
  const box=$('#dChart'); if(!box) return; const cv=$('canvas',box), dpr=window.devicePixelRatio||1, W=box.clientWidth, H=box.clientHeight;
  if(cv.width!==Math.round(W*dpr) || cv.height!==Math.round(H*dpr)){ cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); }
  const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,W,H);
  const pts=chartState.pts;
  if(!pts||pts.length<2){if(chartState.range==='LIVE'){const msg=$('#dMsg');msg.textContent='Waiting for live quote observations.';msg.style.display='grid';}return;}
  if(chartState.range==='LIVE') $('#dMsg').style.display='none';
  const cs=getComputedStyle(document.documentElement), col=v=>cs.getPropertyValue(v).trim();
  const chartFont=getComputedStyle(document.querySelector('.chart .tip')||document.body).fontSize+' Inter, system-ui, sans-serif';
  const padT=24, padB=20, padX=6, xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  g.font=chartFont;
  let lo,hi;
  if(chartState.range==='LIVE'){
    lo=Math.min(...ys);hi=Math.max(...ys);
    const breathingRoom=(hi-lo)*0.08||Math.abs(hi)*0.01||1;
    lo-=breathingRoom;hi+=breathingRoom;
  }else{
    lo=Math.min(...ys,chartState.base);hi=Math.max(...ys,chartState.base);if(hi===lo){hi+=1;lo-=1;}
  }
  const padR=Math.ceil(Math.max(g.measureText(money(hi,chartState.sym)).width, g.measureText(money(lo,chartState.sym)).width))+12, PW=W-padX-padR;
  const axisEnd=xs[xs.length-1];
  const axisStart=xs[0];
  const span=axisEnd-axisStart;
  const X=i=>padX+PW*(span>0?(xs[i]-axisStart)/span:i/(pts.length-1)), Y=v=>padT+(H-padT-padB)*(1-(v-lo)/(hi-lo));
  const up=ys[ys.length-1]>=(chartState.range==='LIVE'?ys[0]:chartState.base), line=col(up?'--gain':'--loss');
  if(chartState.range==='LIVE'){
    g.font=chartFont;g.textAlign='right';
    for(let i=0;i<=4;i++){const value=hi-i*(hi-lo)/4,y=Y(value);g.strokeStyle=col('--border');g.lineWidth=1;g.beginPath();g.moveTo(padX,y);g.lineTo(padX+PW,y);g.stroke();g.fillStyle=col('--muted');g.fillText(money(value,chartState.sym),W-2,y+3);}
  }
  // baseline
  if(chartState.range!=='LIVE'||(chartState.base>lo&&chartState.base<hi)){
    g.strokeStyle=col('--border-strong'); g.setLineDash([3,4]); g.lineWidth=1; g.beginPath(); g.moveTo(padX,Y(chartState.base)); g.lineTo(padX+PW,Y(chartState.base)); g.stroke(); g.setLineDash([]);
  }
  // area + line
  const grad=g.createLinearGradient(0,padT,0,H-padB); grad.addColorStop(0, line+'55'); grad.addColorStop(1, line+'00');
  g.beginPath(); ys.forEach((v,i)=> i?g.lineTo(X(i),Y(v)):g.moveTo(X(i),Y(v))); g.lineWidth=2; g.strokeStyle=line; g.lineJoin='round'; g.stroke();
  g.lineTo(X(pts.length-1),H-padB); g.lineTo(X(0),H-padB); g.closePath(); g.fillStyle=grad; g.fill();
  // axis labels
  g.fillStyle=col('--muted'); g.font=chartFont; g.textBaseline='alphabetic';
  const sym=chartState.sym; g.textAlign='right';
  if(chartState.range!=='LIVE'){g.fillText(money(hi,sym), W-2, padT+9);g.fillText(money(lo,sym), W-2, H-padB);}
  else{
    const last=ys[ys.length-1],y=Y(last),x=X(pts.length-1),label=money(last,sym);
    g.fillStyle=line;g.beginPath();g.arc(x,y,3,0,Math.PI*2);g.fill();
    g.setLineDash([2,3]);g.strokeStyle=line;g.beginPath();g.moveTo(x,y);g.lineTo(W-padR+3,y);g.stroke();g.setLineDash([]);
    g.font=chartFont;const width=g.measureText(label).width+6;g.fillRect(W-width,y-7,width,14);g.fillStyle=col('--page');g.fillText(label,W-3,y+3);
  }
  g.fillStyle=col('--muted');
  const day=chartState.range==='LIVE'||chartState.range==='1D'||chartState.range==='1W', tz=chartState.tz || (isINR(sym)?'Asia/Kolkata':'America/New_York');
  const lab=t=> day ? new Date(t).toLocaleTimeString('en-GB',{timeZone:tz,hour:'2-digit',minute:'2-digit',hour12:false}) : new Date(t).toLocaleDateString('en-GB',{timeZone:tz,day:'2-digit',month:'short',year:chartState.range==='5Y'||chartState.range==='1Y'?'2-digit':undefined});
  g.textAlign='left'; g.fillText(lab(axisStart), padX, H-padB+14);
  g.textAlign='right'; g.fillText(lab(axisEnd), padX+PW, H-padB+14);
  const tip=$('#dTip');
  if(hover!=null){
    let i=0; for(let j=1;j<pts.length;j++) if(Math.abs(X(j)-hover)<Math.abs(X(i)-hover)) i=j;
    const x=X(i), y=Y(ys[i]);
    g.strokeStyle=col('--muted'); g.lineWidth=1; g.beginPath(); g.moveTo(x,padT); g.lineTo(x,H-padB); g.stroke();
    g.fillStyle=line; g.beginPath(); g.arc(x,y,4.5,0,7); g.fill(); g.strokeStyle=col('--surface'); g.lineWidth=2; g.stroke();
    const d=ys[i]-chartState.base; tip.innerHTML=`<span class="num">${money(ys[i],sym)}</span> <span class="${dir(d)} num">${pct(d/chartState.base*100)}</span> · ${esc(lab(xs[i]))}${day?(isINR(sym)?' IST':' ET'):''}`;
  } else tip.textContent='';
}
function bindChart(){
  const box=$('#dChart'); let hold=null, active=false, frame=null, hover;
  const paint=x=>{ hover=x; if(frame===null) frame=requestAnimationFrame(()=>{frame=null; drawChart(hover);}); };
  const at=e=>e.clientX-box.getBoundingClientRect().left;
  box.addEventListener('pointerdown', e=>{ const x=at(e); hold=setTimeout(()=>{ active=true; box.style.touchAction='none'; paint(x); }, e.pointerType==='mouse'?0:180); });
  box.addEventListener('pointermove', e=>{ if(active){ e.preventDefault(); paint(at(e)); } else if(e.pointerType!=='mouse'){ clearTimeout(hold); } });
  const end=()=>{ clearTimeout(hold); if(frame!==null){cancelAnimationFrame(frame);frame=null;} if(active){ active=false; box.style.touchAction='pan-y'; drawChart(); } };
  box.addEventListener('pointerup', end); box.addEventListener('pointercancel', end); box.addEventListener('pointerleave', end);
}
window.addEventListener('resize', ()=>drawChart());

function renderEco(){
  const el=$('#s-eco'), mode=MODE;
  el.innerHTML=`<div class="h"><h2>${mode==='in'?'India':'United States'} · economy</h2></div><div class="eco" id="ecList">${'<div><span class="sk" style="height:12px;width:80%"></span><span class="sk" style="height:24px;width:60%;margin-top:10px"></span></div>'.repeat(6)}</div><p class="note">US: Bureau of Labor Statistics (monthly) and World Bank (annual GDP). India: World Bank (annual).</p>`;
  api('/api/econ',{ttl:3600000, timeout:30000}).then(d=>{
    if(MODE!==mode || !$('#ecList')) return;
    const rows=(d&&d[mode])||[];
    $('#ecList').innerHTML = rows.length ? rows.map(c=>`<div><div class="k">${esc(c.label)}</div><div class="v num">${esc(c.value)}</div>${c.change?`<span class="chip ${c.dir==='up'?'up':c.dir==='down'?'down':'flat'} num">${c.dir==='up'?'▲ ':c.dir==='down'?'▼ ':''}${esc(String(c.change).replace(/^[+-]/,''))}</span>`:''}<div class="m">${esc(c.sub||'')}${c.next?' · next '+esc(c.next):''}</div></div>`).join('')
      : '<div style="grid-column:1/-1" class="empty">No indicators available right now.</div>';
  }).catch(()=>{ if($('#ecList')) $('#ecList').innerHTML='<div style="grid-column:1/-1">'+errBox('Economic indicators could not be loaded.','e')+'</div>'; });
}
const FX_PAIRS=['USDINR=X','EURUSD=X','GBPUSD=X','USDJPY=X','AUDUSD=X','USDCAD=X','USDCHF=X','USDCNY=X','EURINR=X','GBPINR=X'];
function fxAsOf(){ return clock(Date.now(),'Asia/Kolkata','IST'); }
function renderFx(){
  const el=$('#s-fx');
  if(!el.dataset.built){ el.innerHTML='<div class="h"><h2>Spot rates</h2><span class="meta" id="fxAs"></span></div><div id="fxList">'+skRows(6)+'</div><p class="note">Yahoo Finance spot rates. Change is against the previous close.</p>'; el.dataset.built='1'; }
  loadQuotes(FX_PAIRS).then(()=>{
    if(!$('#fxList')) return;
    const fmt=v=> ok(v) ? nf(v, v>=20?2:4, 'en-US') : '—';
    $('#fxList').innerHTML='<div class="card">'+FX_PAIRS.map(s=>{ const q=QUOTES[s], nm=(q&&q.name)||s.replace('=X','').replace(/^(...)(...)$/,'$1/$2');
      return `<div class="row"><div class="l"><div class="s">${esc(nm)}</div><div class="n num">${q?`Day ${fmt(q.low)} – ${fmt(q.high)}`:''}</div></div><div class="r"><div class="p num" data-px="${esc(s)}" data-fx="1">${q?fmt(q.price):'—'}</div><span class="chip ${dir(q&&q.pct)} num" data-ch="${esc(s)}">${q?arrow(q.pct)+pct(q.pct).replace(/^[+-]/,''):'—'}</span></div></div>`; }).join('')+'</div>';
    $('#fxAs').textContent = fxAsOf();
  }).catch(()=>{ if($('#fxList')) $('#fxList').innerHTML=errBox('Rates are unavailable right now.','f'); });
}


/* Display clocks advance independently of quote/network polling. Data age remains source-backed. */
function tickDisplayClocks(){
  if(!connectionUiActive()) return;
  const scr=$('.screen.active'); if(!scr) return;
  $$('[data-live-clock]',scr).forEach(el=>{
    const sym=el.dataset.liveClock, text=asOf(sym), ts=QUOTE_ASOF[sym];
    if(el.textContent!==text) el.textContent=text;
    el.title=ts?'Data updated '+(isINR(sym)?clock(ts,'Asia/Kolkata','IST'):clock(ts,'America/New_York','ET')):'Data update unavailable';
  });
  const fx=$('#fxAs',scr); if(fx){fx.textContent=fxAsOf();const times=FX_PAIRS.map(s=>QUOTE_ASOF[s]).filter(Boolean);fx.title=times.length?'Data updated '+clock(Math.min(...times),'Asia/Kolkata','IST'):'Data update unavailable';}
}
setInterval(tickDisplayClocks,1000);
document.addEventListener('visibilitychange',tickDisplayClocks);

  $('#s-more').innerHTML=`<div class="h"><h2>Settings</h2></div><div class="card">
      <div class="set"><div><b>Market</b><small>Indices, movers, search and watchlist follow this</small></div><div class="seg" id="setMode"><button data-v="us">US</button><button data-v="in">India</button></div></div>
      <div class="set"><div><b>Appearance</b><small>Dark is the default terminal look</small></div><div class="seg" id="setTheme"><button data-v="dark">Dark</button><button data-v="light">Light</button></div></div>
      <div class="set"><div><b>Price flashes</b><small>Highlight price changes as quotes update</small></div><div class="seg" id="setFlash"><button data-v="on">On</button><button data-v="off">Off</button></div></div>
    </div>

      <p>Data: Yahoo Finance (quotes, charts, fundamentals, options, analysts, peers); SEC EDGAR (US financial statements, 13F holdings, Form 4 insider trades, deal filings, subsidiaries); Screener.in (Indian statements and shareholding); NSE (NIFTY constituents, announcements, bulk and block deals, IPOs); Nasdaq (earnings and IPO calendar, Nasdaq-100 list); State Street (S&amp;P 500 and Dow holdings); Wikipedia (SENSEX list); LuxAlgo Market Trackers (congressional trades); official USAspending API (federal contracts); official OGE electronic reports + Open Cabinet history (executive-branch trades, non-commercial use); Google News (headlines). Figures can be delayed; missing values show as "—".</p>
      <p><b>For informational purposes only. Not investment advice.</b></p>
    </div>
    <div class="h"><h2>Storage</h2></div><div class="card"><div class="set"><div><b>Offline copy</b><small>The last data you viewed is kept on this phone for offline use</small></div><button class="btn ghost" id="clr" style="margin:0;height:38px;padding:0 14px">Clear</button></div></div>`;
  const mark=(id,v)=>$$('#'+id+' button').forEach(b=>b.classList.toggle('on', b.dataset.v===v));
  mark('setMode',MODE); mark('setTheme',th); mark('setFlash',FLASH_ON?'on':'off');
  $('#setFlash').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; FLASH_ON=b.dataset.v==='on'; LS.set('flash',FLASH_ON); mark('setFlash',b.dataset.v); if(!FLASH_ON) $$('.fu,.fd').forEach(el=>el.classList.remove('fu','fd')); };
  $('#setMode').onclick=e=>{ const b=e.target.closest('button'); if(b){ MODE=b.dataset.v; LS.set('mode',MODE); $('#modeBtn').textContent=MODE==='in'?'INDIA':'US'; mark('setMode',MODE); toast(MODE==='in'?'India market':'US market'); } };
  $('#setTheme').onclick=e=>{ const b=e.target.closest('button'); if(!b) return; LS.set('theme',b.dataset.v);
    document.documentElement.setAttribute('data-theme',b.dataset.v); mark('setTheme',b.dataset.v);
    const mc=document.querySelector('meta[name=theme-color]'); if(mc) mc.content = b.dataset.v==='light' ? '#f4f5f8' : '#141417'; drawChart(); };
  $('#clr').onclick=()=>{ try{ Object.keys(localStorage).filter(k=>k.startsWith('eqxm.c.')).forEach(k=>localStorage.removeItem(k)); }catch(e){} toast('Offline copy cleared'); };
}

/* ---------- pull to refresh, live refresh, boot ---------- */
(function(){ const host=$('#screens'), pill=$('#pull'); let y0=null, armed=false;
  host.addEventListener('touchstart', e=>{ const s=$('.screen.active'); y0 = s && s.scrollTop<=0 && e.touches.length===1 ? e.touches[0].clientY : null; armed=false; }, {passive:true});
  host.addEventListener('touchmove', e=>{ if(y0==null) return; armed = e.touches[0].clientY-y0 > 90 && $('.screen.active').scrollTop<=0; pill.classList.toggle('show', armed); }, {passive:true});
  host.addEventListener('touchend', ()=>{ if(armed){ refresh(true); if(stack[stack.length-1].s==='detail') loadChart(stack[stack.length-1].sym); toast('Refreshed'); } pill.classList.remove('show'); y0=null; armed=false; }, {passive:true});
})();
document.addEventListener('visibilitychange', ()=>{ if(document.hidden) stopPolling(); else liveTick(); });
$('#modeBtn').textContent = MODE==='in' ? 'INDIA' : 'US';
history.replaceState(stack[0],''); show(stack[0], false);
liveT=setTimeout(liveTick, 3000);
let scrollT=null;
$('#screens').addEventListener('scroll', ()=>{ clearTimeout(scrollT); scrollT=setTimeout(liveTick, 350); }, {capture:true, passive:true});
</script>
</body>
